name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp and sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass

      - name: SFTP deploy to mlxip.com
        env:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          pass: ${{ secrets.FTP_PASS }}
        run: |
          for i in 1 2 3 4 5; do
            if lftp -e "set sftp:auto-confirm yes; set sftp:connect-program 'sshpass -p $pass ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no'; set net:max-retries 5; set net:timeout 30; mirror -R --parallel=1 --delete --exclude-glob ^\.git.* --exclude-glob ^\.github/ --exclude-glob ^deploy\.sh$ --exclude-glob \.DS_Store --exclude-glob ^README\.md$ --exclude-glob ^copy/ --exclude-glob ^assets/references/ . .; bye" "sftp://$user@$host:65002"; then
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All deploy attempts failed"
          exit 1
