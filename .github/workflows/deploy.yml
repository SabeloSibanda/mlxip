name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy via SSH (tar over one connection)
        env:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          pass: ${{ secrets.FTP_PASS }}
        run: |
          SSH_OPTS="-p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o ConnectTimeout=20"
          export SSHPASS="$pass"
          TARGET="$user@$host"

          for i in 1 2 3 4 5; do
            echo "=== Attempt $i"
            if sshpass -e ssh $SSH_OPTS "$TARGET" "rm -rf css js assets && mkdir -p css/fonts js/vendor assets/videos" && \
               tar --exclude='./.git' --exclude='./.gitignore' --exclude='./.github' \
                   --exclude='./deploy.sh' --exclude='./README.md' --exclude='./copy' \
                   --exclude='./assets/references' --exclude='*.DS_Store' -cf - . | \
               sshpass -e ssh $SSH_OPTS "$TARGET" "tar -xf - -C ." && \
               sshpass -e ssh $SSH_OPTS "$TARGET" "ls -la; test -f index.html && test -f css/styles.css && test -f js/main.js && echo DEPLOY_VERIFIED_OK"; then
              echo "Deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "All deploy attempts failed"
          exit 1

